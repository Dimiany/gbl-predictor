# The test site: every pull request is published to one fixed address,
# https://gbl-predictor-test.web.app (a second Firebase Hosting site), and the
# PR gets a comment with the link, so a change can be checked on a phone
# before it goes live. The newest PR push wins if several are open.
#
# The preview never calls the API and never logs predictions (it builds from
# the data in the branch), shows a yellow "ΔΟΚΙΜΑΣΤΙΚΗ ΕΚΔΟΣΗ" strip, is
# noindex, and its contact form writes to test_contact_messages.

name: Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    if: vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GBL_SITE_MODE: preview
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Build the page (no API, no logging)
        run: python scripts/build_dashboard.py --no-sync --no-log

      - name: Publish to the test site
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TEST_SITE: gbl-predictor-test
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          fb() { npx --yes firebase-tools@15 "$@" --project "$FIREBASE_PROJECT_ID" --non-interactive; }
          # First run only: create the second Hosting site (free on the Spark plan).
          fb hosting:sites:get "$TEST_SITE" > /dev/null 2>&1 || fb hosting:sites:create "$TEST_SITE"
          fb deploy --only "hosting:$TEST_SITE" --message "PR #$PR"
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
          url="https://$TEST_SITE.web.app"
          body="🔎 **Δοκιμαστικό site:** $url

          Πάντα το ίδιο link: δείχνει την τελευταία αλλαγή που περιμένει έγκριση (αυτό το αίτημα, #$PR)."
          echo "$body" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --edit-last --body "$body" || gh pr comment "$PR" --body "$body"
