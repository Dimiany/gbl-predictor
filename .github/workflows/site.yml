# The public site: build it and publish it to Firebase Hosting.
#
#   schedule           every night; calls the API only when something is due
#                      (src/web/build.sync_due), commits the new data, publishes
#   workflow_dispatch  the "Run workflow" button: sync now (or just rebuild)
#   push to main       code changes go live with the data already in the repo
#
# GitHub Actions owns sync + prediction logging; the desktop app pulls the
# result (GBL_CLOUD_SYNC=1 in its .env). Skipped until Firebase is configured.
#
# Repository secrets:   RAPIDAPI_KEY, FIREBASE_SERVICE_ACCOUNT (service-account JSON)
# Repository variables: FIREBASE_PROJECT_ID, FIREBASE_API_KEY,
#                       FLASHSCORE_TOURNAMENT_TEMPLATE_ID, FLASHSCORE_SEASON_ID

name: Site

on:
  schedule:
    # 22:30 UTC = 01:30 Athens in summer, 00:30 in winter: after the evening games.
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      sync:
        description: "Φέρε νέα αποτελέσματα από το API (αλλιώς μόνο ξαναχτίσιμο)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths-ignore: ["**.md", "*.ipynb", "notebooks/**", "tests/**"]

# One live update at a time; never cancel one half-way through a data commit.
concurrency:
  group: site-live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GBL_SITE_MODE: live
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FLASHSCORE_TOURNAMENT_TEMPLATE_ID: ${{ vars.FLASHSCORE_TOURNAMENT_TEMPLATE_ID }}
      FLASHSCORE_SEASON_ID: ${{ vars.FLASHSCORE_SEASON_ID }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests (a broken push never goes live)
        if: github.event_name == 'push'
        run: python -m pytest tests/ -q

      - name: Update data and build the page
        id: build
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          EVENT: ${{ github.event_name }}
          SYNC_INPUT: ${{ inputs.sync }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            python scripts/build_dashboard.py --auto
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$SYNC_INPUT" = "true" ]; then
            python scripts/build_dashboard.py
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            python scripts/build_dashboard.py --no-sync --no-log
            echo "built=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the new data
        if: steps.build.outputs.built == 'true' && github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/all_fixtures.csv data/raw/upcoming_fixtures.csv \
                  data/prediction_history.csv data/team_logos.csv
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: automatic update $(date -u +%F)"
            git pull --rebase
            git push
          fi

      - name: Publish to Firebase
        if: steps.build.outputs.built == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          # Only the live site: firebase.json also defines the test site (preview.yml).
          targets=hosting:gbl-predictor
          if [ "${{ github.event_name }}" = "push" ]; then targets=$targets,firestore:rules; fi
          npx --yes firebase-tools@15 deploy --only "$targets" \
            --project "$FIREBASE_PROJECT_ID" --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
